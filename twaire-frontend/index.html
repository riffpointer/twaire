<!doctype html>

<head>

  <style>
    ._loading-wrapper {
      padding: 0;
      margin: 0;
      width: 100%;
      height: 95vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #root,
    html,
    body {
      background: #111;
    }

    @media (prefers-color-scheme: dark) {
      ._loading-wrapper {
        background: #111;
        color: #fff;
      }
    }

    ._loading-svg {
      --uib-size: 55px;
      --uib-color: #fff;
      --uib-speed: 1.3s;
      --uib-bg-opacity: .1;
      height: calc(var(--uib-size) * (2.1 / 5));
      width: var(--uib-size);
      transform-origin: center;
      overflow: visible;
    }

    .car {
      fill: none;
      stroke: var(--uib-color);
      stroke-dasharray: 15, 85;
      stroke-dashoffset: 0;
      stroke-linecap: round;
      animation: travel var(--uib-speed) linear infinite;
      will-change: stroke-dasharray, stroke-dashoffset;
      transition: stroke 0.5s ease;
    }

    .track {
      stroke: var(--uib-color);
      opacity: var(--uib-bg-opacity);
    }

    @keyframes travel {
      0% {
        stroke-dashoffset: 0;
      }

      100% {
        stroke-dashoffset: 100;
      }
    }
  </style>
</head>

<body>
  <div id="root">
    <div class="_loading-wrapper">
      <svg class="_loading-svg" x="0px" y="0px" viewBox="0 0 55 23.1" height="23.1" width="55"
        preserveAspectRatio='xMidYMid meet'>

        <path class="car" fill="none" stroke-width="4" pathlength="100"
          d="M26.7,12.2c3.5,3.4,7.4,7.8,12.7,7.8c5.5,0,9.6-4.4,9.6-9.5C49,5,45.1,1,39.8,1c-5.5,0-9.5,4.2-13.1,7.8l-3.4,3.3c-3.6,3.6-7.6,7.8-13.1,7.8C4.9,20,1,16,1,10.5C1,5.4,5.1,1,10.6,1c5.3,0,9.2,4.5,12.7,7.8L26.7,12.2z" />
