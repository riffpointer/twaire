<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Twaire - Share your videos" />
  <meta name="keywords" content="Twaire, social, ideas, sharing, platform" />
  <meta name="author" content="Twaire" />
  <meta property="og:title" content="Twaire" />
  <meta property="og:description" content="Share your videos" />
  <meta property="og:type" content="website" />
  <meta name="twitter:title" content="Twaire" />
  <meta name="twitter:description" content="Share your videos" />
  <title>Twaire</title>
  <style>
    ._loading-wrapper {
      padding: 0;
      margin: 0;
      width: 100%;
      height: 100%;
    }

    #root,
    html,
    body {
      background: #111;
    }

    .loading-svg {
      --s: 80vmin;
      position: absolute;
      left: calc(50vw - var(--s) / 2);
      top: calc(50vh - var(--s) / 2);
      width: var(--s);
      height: var(--s);
      transform: scale(0.1);
    }

    .loading-svg circle {
      --r: 47px;
      --1deg: calc(2 * pi * var(--r) / 360);
      stroke-width: calc((50% - var(--r)) * 2);
      stroke: #111;
      animation: dash-anim 1400ms ease-in-out infinite, full-rotation-anim 2000ms linear infinite;
      transform-origin: 50% 50%;
    }

    @keyframes dash-anim {
      0% {
        stroke-dasharray: 0 0 calc(2 * var(--1deg)) calc(358 * var(--1deg));
      }

      50% {
        stroke-dasharray: 0 calc(35 * var(--1deg)) calc(290 * var(--1deg)) calc(35 * var(--1deg));
      }

      100% {
        stroke-dasharray: 0 calc(358 * var(--1deg)) calc(2 * var(--1deg));
      }
    }

    @keyframes full-rotation-anim {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    @media (prefers-color-scheme: dark) {
      .loading-svg circle {
        stroke: #fff;
      }

      ._loading-wrapper {
        background: #111;
        color: #fff;
      }
    }
  </style>
</head>
<body>
  <div id="root">
    <div class="_loading-wrapper">
      <!-- Thanks to: https://dev.to/alekseiberezkin/creating-a-material-spinner-with-pure-and-simple-css-1b60 -->
      <svg viewBox='0 0 100 100' xmlns="http://www.w3.org/2000/svg" class="loading-svg">
        <circle cx='50' cy='50' r='47' stroke="#333" fill='none' />
      </svg>
    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
